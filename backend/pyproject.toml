[project]
name = "techatlas-backend"
version = "0.1.0"
description = "TechAtlas graph API — serves the curated technology knowledge graph."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "hypothesis>=6.100",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# One-off Phase 1B data-authoring scripts: their output (data/seed/*.json) is the
# real deliverable and is validated by scripts/validate_dataset.py. The generators
# themselves are provenance, not shipped code, so they are excluded from lint.
extend-exclude = ["../scripts/expand"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
