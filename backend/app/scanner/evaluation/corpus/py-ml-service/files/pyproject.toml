[project]
name = "ml-service"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4",
  "transformers>=4.44",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "mlflow>=2.16",
  "celery>=5.4",
  "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
