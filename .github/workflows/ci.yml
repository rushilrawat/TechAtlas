name: CI

on:
  push:
  pull_request:

jobs:
  data:
    name: Dataset build & validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build dataset
        run: python scripts/build_dataset.py
      - name: Validate dataset
        run: python scripts/validate_dataset.py
      - name: Generate layout
        run: python scripts/generate_layout.py

  backend:
    name: Backend tests & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build + validate dataset (API serves it)
        run: |
          python scripts/build_dataset.py
          python scripts/validate_dataset.py
          python scripts/generate_layout.py
      - name: Install backend
        working-directory: backend
        run: |
          pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: ruff check app tests ../scripts
      - name: Test
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
