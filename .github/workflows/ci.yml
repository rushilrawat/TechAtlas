name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data:
    name: Dataset build & validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build dataset
        run: python scripts/build_dataset.py
      - name: Validate dataset (enforce Phase 1B milestone targets)
        run: python scripts/validate_dataset.py --require-targets
      - name: Generate layout
        run: python scripts/generate_layout.py
      # The backend Docker image serves the COMMITTED graph.json, so it must match what
      # the seed data builds. (layout.json is excluded: float tie-breaks differ by platform.)
      - name: Committed graph.json is up to date
        run: git diff --exit-code -- data/graph.json

  backend:
    name: Backend tests & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build + validate dataset (API serves it)
        run: |
          python scripts/build_dataset.py
          python scripts/validate_dataset.py
          python scripts/generate_layout.py
      - name: Install backend (pinned runtime deps, same as the Docker image)
        working-directory: backend
        run: |
          pip install -r requirements.lock
          pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: ruff check app tests ../scripts
      - name: Test
        working-directory: backend
        run: pytest -q

  docker:
    name: Backend Docker image builds and serves /health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f backend/Dockerfile -t techatlas-backend .
      - name: Smoke test /health
        run: |
          docker run -d --name api -p 8000:8000 techatlas-backend
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1

  frontend:
    name: Frontend typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Bundle size budget
        working-directory: frontend
        run: npm run size

      # Repo X-Ray browser e2e (Phase 1.5B): build a SCANNER-ENABLED static bundle and
      # run the Playwright flow against mocked scanner responses. Also needs the static
      # API JSON rendered from the dataset. The public Pages deploy stays scanner-DISABLED.
      - name: Render static API for e2e
        run: |
          pip install -e "backend[dev]"
          python scripts/build_dataset.py
          python scripts/generate_layout.py
          python scripts/build_static_api.py
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build scanner-enabled bundle (dist-xray)
        working-directory: frontend
        env:
          VITE_BASE: /TechAtlas/
          VITE_STATIC_API: "true"
          VITE_SCANNER_API: /api/v1
        run: |
          npx vite build
          mv dist dist-xray
          cp dist-xray/index.html dist-xray/404.html
      - name: Repo X-Ray e2e (scanner enabled, mocked responses)
        working-directory: frontend
        run: npm run e2e:xray
