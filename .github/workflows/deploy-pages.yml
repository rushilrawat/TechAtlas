# Deploy the TechAtlas frontend to GitHub Pages as a fully static site.
#
# GitHub Pages serves static files only, so there is no FastAPI backend in this
# deployment. Instead we pre-render the API responses to static JSON
# (scripts/build_static_api.py) and build the frontend in STATIC mode, which fetches
# those files and runs search in the browser. Wikipedia summaries are omitted in the
# static build (the UI degrades to the outbound link), matching the backend's own
# graceful-degradation path.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Served from https://<user>.github.io/TechAtlas/ -> base path must match the repo.
      VITE_BASE: /TechAtlas/
      VITE_STATIC_API: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # 1) Build + validate the dataset and layout the API will be rendered from.
      - name: Build dataset
        run: |
          pip install -e "backend[dev]"
          python scripts/build_dataset.py
          python scripts/validate_dataset.py --require-targets
          python scripts/generate_layout.py

      # 2) Pre-render the API responses to static JSON under frontend/public/api/v1/.
      - name: Render static API
        run: python scripts/build_static_api.py

      # 3) Build the frontend in static mode at the correct base path.
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: SPA fallback for deep links
        working-directory: frontend
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
        with:
          # Create/enable the Pages site (with Actions as the source) on first run,
          # avoiding the chicken-and-egg where the site must pre-exist.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
