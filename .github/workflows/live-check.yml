name: Live site check

# Catches silent breakage between deploys: the public Pages site must serve the app
# shell, the static graph and the sitemap, and the scanner backend (when configured)
# must answer /health. Render Free may be asleep, so /health gets a generous timeout.

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC, after the weekly discovery run
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SITE: https://rushilrawat.github.io/TechAtlas
      SCANNER_API_URL: ${{ vars.SCANNER_API_URL }}
    steps:
      - name: App shell, graph and sitemap respond
        run: |
          set -e
          curl -fsS "$SITE/" | grep -q '<div id="root">'
          curl -fsS "$SITE/api/v1/graph.json" | python3 -c "import json,sys; d=json.load(sys.stdin); assert len(d['nodes']) > 500, len(d['nodes'])"
          curl -fsS "$SITE/sitemap.xml" | grep -q "<urlset"
          curl -fsS "$SITE/technology/react/" | grep -q "seo-fallback"
      - name: Scanner backend /health (if configured)
        if: env.SCANNER_API_URL != ''
        run: |
          base="${SCANNER_API_URL%/api/v1}"
          curl -fsS --max-time 90 --retry 2 "$base/health"
